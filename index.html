<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wazly — خدمة عملاء بالـ AI على كل القنوات</title>
    <meta
      name="description"
      content="Wazly بيتعامل مع محادثات عملائك على واتساب، إنستجرام، ماسنجر وتعليقات فيسبوك — بـ AI يرد فورًا، يتعلم شغلك، ويحوّل لفريقك وقت الحاجة."
    />
    <meta property="og:title" content="Wazly — خدمة عملاء بالـ AI" />
    <meta
      property="og:description"
      content="كل محادثات عملائك في مكان واحد. عميلك ياخد رد فوري، وانت تاخد عملاء مؤهلين."
    />
    <meta property="og:locale" content="ar_EG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <script>
      // Restore language and theme before first paint so there is no flash of
      // the wrong direction or the wrong colour scheme. Values are written by
      // useLocalStorage (JSON), hence the defensive quote stripping.
      (function () {
        try {
          var read = function (key) {
            var raw = localStorage.getItem(key);
            return raw ? String(raw).replace(/^"|"$/g, '') : '';
          };
          var root = document.documentElement;

          var lang = read('wazly-lang');
          if (lang !== 'ar' && lang !== 'en') lang = 'ar';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.classList.add(lang === 'ar' ? 'lang-ar' : 'lang-en');

          var theme = read('wazly-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            root.classList.add('dark');
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the markup defaults */
        }
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
